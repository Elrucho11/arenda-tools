<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1d22">
  <title>АрендаСтрой · Инструмент</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="theme.css?v=9">
  <link rel="stylesheet" href="app.css?v=9">
</head>
<body>
  <!-- Шапка -->
  <header class="app-header">
    <div class="app-header__inner">
      <a href="#/" class="brand">
        <span class="brand__mark">А</span>
        <span class="brand__text">Аренда<b>Строй</b> · Инструмент</span>
      </a>
      <nav class="app-nav">
        <span class="sync-status" id="syncStatus" title="Состояние синхронизации"></span>
        <a href="#/" class="app-nav__link" data-nav="catalog">Каталог</a>
        <button class="btn btn--primary btn--sm" id="navScan">📷 Сканировать</button>
      </nav>
    </div>
  </header>

  <main id="view" class="app-main"></main>

  <!-- Плавающая кнопка сканера (моб.) -->
  <button class="fab pulse" id="fabScan" title="Сканировать QR">📷</button>

  <!-- Модальное окно -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal__close" id="modalClose" aria-label="Закрыть">✕</button>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <!-- Тост-уведомления -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=9"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="vendor/html5-qrcode.min.js"></script>
  <script src="catalog-data.js?v=9"></script>
  <script src="app.js?v=9"></script>
  <script>
    // Убираем любой ранее установленный service worker и его кэш — чтобы устройства
    // всегда получали свежую версию (раньше из-за кэша подгружалась старая).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    }
    if (window.caches) {
      caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
    }
  </script>
</body>
</html>
