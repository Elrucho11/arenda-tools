<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1d22" id="themeColor">
  <title>АрендаСтрой · Инструмент</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    // Применяем сохранённую тему сразу, до отрисовки — чтобы не было мигания
    try { var _t = localStorage.getItem('theme'); if (_t === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="theme.css?v=11">
  <link rel="stylesheet" href="app.css?v=11">
</head>
<body>
  <!-- Шапка -->
  <header class="app-header">
    <div class="app-header__inner">
      <a href="#/" class="brand" aria-label="АрендаСтрой · Инструмент">
        <svg class="brand__logo" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="АрендаСтрой">
          <rect width="300" height="300" rx="66" fill="#ff6a00"/>
          <g stroke="#fff" stroke-width="9" stroke-linecap="square" fill="none">
            <!-- стойки лесов -->
            <line x1="76" y1="50" x2="76" y2="250"/>
            <line x1="100" y1="58" x2="100" y2="238"/>
            <line x1="200" y1="58" x2="200" y2="238"/>
            <line x1="224" y1="50" x2="224" y2="250"/>
            <!-- верхние перекладины (связь башен) -->
            <line x1="76" y1="60" x2="224" y2="60"/>
            <line x1="76" y1="74" x2="224" y2="74"/>
            <!-- ступени левой лестницы -->
            <line x1="76" y1="92" x2="100" y2="92"/>
            <line x1="76" y1="118" x2="100" y2="118"/>
            <line x1="76" y1="144" x2="100" y2="144"/>
            <line x1="76" y1="170" x2="100" y2="170"/>
            <line x1="76" y1="196" x2="100" y2="196"/>
            <line x1="76" y1="222" x2="100" y2="222"/>
            <!-- ступени правой лестницы -->
            <line x1="200" y1="92" x2="224" y2="92"/>
            <line x1="200" y1="118" x2="224" y2="118"/>
            <line x1="200" y1="144" x2="224" y2="144"/>
            <line x1="200" y1="170" x2="224" y2="170"/>
            <line x1="200" y1="196" x2="224" y2="196"/>
            <line x1="200" y1="222" x2="224" y2="222"/>
            <!-- центральные раскосы (две секции X) -->
            <line x1="100" y1="88" x2="200" y2="156"/>
            <line x1="200" y1="88" x2="100" y2="156"/>
            <line x1="100" y1="156" x2="200" y2="224"/>
            <line x1="200" y1="156" x2="100" y2="224"/>
            <line x1="100" y1="88" x2="200" y2="88"/>
            <line x1="100" y1="156" x2="200" y2="156"/>
            <line x1="100" y1="224" x2="200" y2="224"/>
          </g>
          <g stroke="#fff" stroke-width="13" stroke-linecap="square">
            <!-- опорные пятки -->
            <line x1="62" y1="252" x2="114" y2="252"/>
            <line x1="186" y1="252" x2="238" y2="252"/>
          </g>
        </svg>
      </a>
      <nav class="app-nav">
        <span class="sync-status" id="syncStatus" title="Состояние синхронизации"></span>
        <a href="#/" class="app-nav__link" data-nav="catalog">Каталог</a>
        <button class="theme-toggle" id="themeToggle" title="Тёмная / светлая тема" aria-label="Переключить тему"></button>
        <button class="btn btn--primary btn--sm" id="navScan">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M4 12h16"/></svg>
          Сканировать
        </button>
      </nav>
    </div>
  </header>

  <main id="view" class="app-main"></main>

  <!-- Плавающая кнопка сканера (моб.) -->
  <button class="fab pulse" id="fabScan" title="Сканировать QR" aria-label="Сканировать QR">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M4 12h16"/></svg>
  </button>

  <!-- Модальное окно -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal__close" id="modalClose" aria-label="Закрыть">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <!-- Тост-уведомления -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=11"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="vendor/html5-qrcode.min.js"></script>
  <script src="catalog-data.js?v=11"></script>
  <script src="app.js?v=11"></script>
  <script>
    // Убираем любой ранее установленный service worker и его кэш — чтобы устройства
    // всегда получали свежую версию (раньше из-за кэша подгружалась старая).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    }
    if (window.caches) {
      caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
    }
  </script>
</body>
</html>
